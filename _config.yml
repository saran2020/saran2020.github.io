# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
theme                    : "minimal-mistakes-jekyll"
minimal_mistakes_skin    : "dirt" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en-GB"
title                    : "Saran Sankaran"
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "Saran"
description              : "Saran's personal blog"
url                      : "https://saran.sankaran.dev" # the base hostname & protocol for your site
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "saran2020/saran2020.github.io"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
words_per_minute         : 160

# Search
search                   : true
search_full_content      : true

# SEO Related
google_site_verification :
bing_site_verification   :

# Social Sharing
twitter:
  username               : "SankaranDev"
og_image                 : # Open Graph/Twitter default site image

# Analytics (Google Analytics 4 / GA4)
analytics:
  provider               : "google-gtag" # "google-gtag", false
  google:
    tracking_id          : # Enter your GA4 Measurement ID here, e.g. "G-XXXXXXXXXX"
    anonymize_ip         : true

# Site Author
author: Saran

# Site Footer
footer:
  links:
    - label        : "X"
      icon         : "fab fa-fw fa-x-twitter"
      url          : "https://x.com/SankaranDev"
    - label        : "GitHub"
      icon         : "fab fa-fw fa-github"
      url          : "https://github.com/saran2020"
    - label        : "LinkedIn"
      icon         : "fab fa-fw fa-linkedin"
      url          : "https://www.linkedin.com/in/saran2020/"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - tmp
  - mise.toml

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: "Asia/Calcutta"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-sitemap

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      excerpt_separator: <!--more-->
      share: true
      related: true

  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
